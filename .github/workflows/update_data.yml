name: Robot de Actualizacion FEB

on:
  schedule:
    # 06:30 UTC (08:30 España) — antes de la sesión matutina (primer partido 9:30)
    - cron: '30 6 * * *'
    # 11:00 UTC (13:00 España) — tras los partidos de 9:30 y 10:30
    - cron: '0 11 * * *'
    # 13:00 UTC (15:00 España) — tras los partidos de 11:30 y 12:30
    - cron: '0 13 * * *'
    # 19:00 UTC (21:00 España) — tras el partido de tarde de 17:30 (~1.5h duración)
    - cron: '0 19 * * *'
    # 21:30 UTC (23:30 España) — tras el partido de noche de 19:30 + ligas FEB nocturnas
    - cron: '30 21 * * *'
  workflow_dispatch:
    # Esto nos permite ejecutar el robot manualmente con un botón cuando queramos

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar librerías
        run: pip install -r requirements.txt

      - name: 🤖 Ejecutar el Robot (Scraping y Limpieza)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python updater.py

      - name: 💾 Guardar los nuevos datos en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "🤖 Automatización: Roster, Calendario y Partidos actualizados" || echo "No hay datos nuevos para guardar"
          git push
